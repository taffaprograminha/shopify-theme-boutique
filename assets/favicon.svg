<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="L'Allure de Marseille">
  <!--
    Monogram A for "L'Allure de Marseille", in the theme's button dark and
    accent gold. Drawn as strokes rather than text so it renders identically
    everywhere: a favicon has no access to the theme's web fonts.

    The two legs are one path so the apex mitres shut; as separate strokes
    the butt caps leave a notch at the point.

    Geometry: apex (32,10), feet (10,54) and (54,54), so each leg runs
    dx/dy = -0.5. At y=40 the legs sit at x=17 and x=47, which is where the
    crossbar has to end to meet them. The letter fills most of the square
    because at a 16px tab size anything smaller stops reading as an A.
  -->
  <rect width="64" height="64" fill="#212121"/>
  <g stroke="#ab8c52" fill="none" stroke-linecap="butt">
    <path d="M10 54 L32 10 L54 54" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <path d="M17 40 L47 40" stroke-width="6"/>
  </g>
</svg>
